[project]
name = "ai-therapist"
version = "0.1.0"
description = "Finetuned SLM counsellor with RAG over South Asian therapeutic techniques"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
