[project]
name = "ai-therapist"
version = "0.1.0"
description = "Finetuned SLM counsellor with RAG over South Asian therapeutic techniques"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.2",
    "sentence-transformers>=3.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]
serving = [
    # GPU model server only; kept out of dev/CI. Installed on demand by `make model-server`.
    # Pinned: 0.22.x is the verified version for our base + LoRA serve path
    # (eval gens F017-11+ ran against it); newer vLLM removed in-tree GGUF entirely.
    "vllm==0.22.1",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
